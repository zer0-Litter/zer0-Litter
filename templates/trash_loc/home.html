{% extends 'nav_base.html' %}

{% block title %}홈페이지_쓰레기 위치찾기{% endblock %}

{% block extra_head %}
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_api_key }}&autoload=false&libraries=services"></script>
{% endblock %}

{% block content %}
  <h1>zer0 Litter는 쓰레기 무단 투기 없는 거리를 지향해요💚</h1>

  <!-- 카카오 지도 영역 -->
  <div id="map" style="width:100%; height:500px;"></div>

  <!-- 쓰레기통 상세 정보 모달 -->
  <div id="trashDetailModal" style="display:none;">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="trashName"></h2>
      <p id="trashAddress"></p>
      <p>종류: <span id="trashType"></span></p>
      <p>설치 장소: <span id="trashLoc"></span></p>
      <p>관리 기관: <span id="trashDept"></span></p>
      <p>관리 연락처: <span id="trashContact"></span></p>
    </div>
  </div>

  <!-- 추천 쓰레기통 리스트 -->
  <div id="recommendationList" style="margin-top: 20px;"></div>

  <script>
    let map;
    let markers = [];
    let userPosition = null;
    let trashList = [];

    let grayMarkerImage;
    let yellowMarkerImage;

    const districtId = "{{ district_id }}";

    function computeDistanceByPolyline(pos1, pos2) {
      if (!pos1 || !pos2) return Infinity;
      const line = new kakao.maps.Polyline({ path: [pos1, pos2] });
      return line.getLength();
    }

    function initMap() {
      map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 5
      });

      // Kakao Maps API가 완전히 로드된 후 MarkerImage 객체 생성
      grayMarkerImage = new kakao.maps.MarkerImage(
        '/static/img/marker_trash_gray.png',
        new kakao.maps.Size(32, 40)
      );
      yellowMarkerImage = new kakao.maps.MarkerImage(
        '/static/img/marker_trash_yellow.png',
        new kakao.maps.Size(32, 40)
      );

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          userPosition = new kakao.maps.LatLng(lat, lon);
          map.setCenter(userPosition);

          new kakao.maps.Marker({
            map: map,
            position: userPosition,
            title: '내 위치',
            image: new kakao.maps.MarkerImage(
              'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
              new kakao.maps.Size(24, 35)
            )
          });

          loadTrashcans(lat, lon);
        }, () => {
          alert('위치 정보를 가져오지 못해 기본 위치(서울시청)로 설정합니다.');
          const defaultLat = 37.5665, defaultLon = 126.9780;
          userPosition = new kakao.maps.LatLng(defaultLat, defaultLon);
          map.setCenter(userPosition);
          loadTrashcans(defaultLat, defaultLon);
        });
      }
    }

    kakao.maps.load(initMap);

    function loadTrashcans(lat, lon, radius = 500) {
      fetch(`/trash_loc/list/${districtId}/?lat=${lat}&lon=${lon}&radius=${radius}`)
        .then(res => res.json())
        .then(data => {
          // 기존 마커 제거
          markers.forEach(m => m.setMap(null));
          markers = [];
          trashList = [];

          data.forEach(trash => {
            if (!trash.t_lat || !trash.t_lon) return;

            const position = new kakao.maps.LatLng(trash.t_lat, trash.t_lon);
            const distance = computeDistanceByPolyline(userPosition, position);
            if (!isFinite(distance)) return;

            // 기본 마커는 회색 이미지로 생성
            const marker = new kakao.maps.Marker({
              map: map,
              position: position,
              title: trash.t_road_addr,
              image: grayMarkerImage,
              clickable: true
            });

            kakao.maps.event.addListener(marker, 'click', () => showTrashDetail(trash));
            markers.push(marker);
            trashList.push({ ...trash, distance });
          });

          trashList.sort((a, b) => a.distance - b.distance);
          displayRecommendationList(trashList);
        })
        .catch(err => {
          console.error("쓰레기통 로드 실패:", err);
          alert("쓰레기통 데이터를 불러오는 데 실패했습니다.");
        });
    }

    function showTrashDetail(trash) {
      document.getElementById('trashName').innerText = trash.t_road_addr || '주소 정보 없음';
      document.getElementById('trashAddress').innerText = trash.t_detailed_addr || '';
      document.getElementById('trashType').innerText = trash.t_trash_type || '알 수 없음';
      document.getElementById('trashLoc').innerText = trash.t_loc || '알 수 없음';
      document.getElementById('trashDept').innerText = trash.t_dept || '알 수 없음';
      document.getElementById('trashContact').innerText = trash.t_contact || '없음';
      document.getElementById('trashDetailModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('trashDetailModal').style.display = 'none';
    }

    function displayRecommendationList(trashes) {
      const container = document.getElementById('recommendationList');

      if (!trashes.length) {
        container.innerHTML = '<p>추천할 수 있는 쓰레기통이 없습니다.</p>';
        return;
      }

      // 거리 필터링: 100m, 300m, 500m 각각 1개씩
      const within100 = trashes.filter(t => t.distance <= 100).sort((a, b) => a.distance - b.distance)[0];
      const within300 = trashes.filter(t => t.distance > 100 && t.distance <= 300).sort((a, b) => a.distance - b.distance)[0];
      const within500 = trashes.filter(t => t.distance > 300 && t.distance <= 500).sort((a, b) => a.distance - b.distance)[0];

      const selected = [
        within100 && { ...within100, range: '100m 이내' },
        within300 && { ...within300, range: '300m 이내' },
        within500 && { ...within500, range: '500m 이내' },
      ].filter(Boolean);

      if (!selected.length) {
        container.innerHTML = '<p>추천할 수 있는 쓰레기통이 없습니다.</p>';
        return;
      }

      // 모든 마커를 기본 회색으로 초기화
      markers.forEach(m => m.setImage(grayMarkerImage));

      // 추천 쓰레기통에 해당하는 마커만 노란색으로 변경
      selected.forEach(trash => {
        const marker = markers.find(m => {
          const pos = m.getPosition();
          return pos.getLat() === trash.t_lat && pos.getLng() === trash.t_lon;
        });
        if (marker) {
          marker.setImage(yellowMarkerImage);
        }
      });

      const html = selected.map(t => `
        <div style="margin-bottom:10px; padding:10px; border:1px solid #ccc; border-radius:6px; display:flex; justify-content:space-between;">
          <div>
            <strong>${t.t_road_addr || '주소 없음'}</strong><br>
            거리: ${t.distance.toFixed(1)}m<br>
            종류: ${t.t_trash_type || '알 수 없음'}<br>
            설치 장소: ${t.t_loc || '-'}
          </div>
          <div style="margin-left:10px; font-weight:bold; color:#0066cc; white-space:nowrap;">${t.range}</div>
        </div>
      `).join('');

      container.innerHTML = `<h3>📌 추천 쓰레기통</h3>${html}`;
    }
  </script>

  <style>
    #trashDetailModal {
      position: fixed;
      z-index: 1000;
      left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
    }
    .modal-content {
      background: #fff;
      margin: 10% auto;
      padding: 20px;
      width: 400px;
      border-radius: 5px;
      position: relative;
    }
    .close {
      position: absolute;
      right: 15px;
      top: 10px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
{% endblock %}
