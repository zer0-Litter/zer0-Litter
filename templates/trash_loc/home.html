{% extends 'nav_base.html' %}
{% load static %}

{% block title %}쓰레기통 지도{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'css/home.css' %}">
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_api_key }}&autoload=false&libraries=services"></script>
{% endblock %}

{% block content %}
<div class="map-container-wrapper">

  <h1 class="page-title"> 공공 쓰레기통 지도</h1>
  <p class="map-description">근처의 쓰레기통, <br> zero Litter로 확인하고  깨끗한 거리를 만들어요!</p>

  <div class="map-card">
    <div id="map"></div>
  </div>
  <div class="recommendation-card">
    <h3 class="recommendation-title"> 거리 기반 추천 쓰레기통</h3>
    <div id="recommendationList"></div>
  </div>
  <div id="trashDetailModal" style="display:none;">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>

      <div class="trash-image">
        <img id="trashImage" src="/static/img/default_bin.png" alt="쓰레기통 사진">
      </div>

      <div class="trash-info">
        <h3 id="trashAddressMain">주소 정보 없음</h3>

        <div class="trash-type-wrap">
          <div class="trash-type" id="type1">
            <img src="/static/img/icon_trash.png" alt="">
            <div>
              <div class="type-name" id="type1-name">일반 쓰레기</div>
              <div class="type-loc" id="type1-loc">위치: -</div>
            </div>
          </div>
          <div class="trash-type" id="type2">
            <img src="/static/img/icon_recycle.png" alt="">
            <div>
              <div class="type-name" id="type2-name">재활용</div>
              <div class="type-loc" id="type2-loc">위치: -</div>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-buttons">
        <button class="btn-find" id="btnFind">길찾기</button>
        <button class="btn-report" id="btnReport">신고하기</button>
      </div>
    </div>
  </div>
</div>

  <script>
  let map;
  let markers = [];
  let userPosition = null;
  let trashList = [];

  let grayMarkerImage;
  let yellowMarkerImage;

  const districtId = "{{ district_id }}";

  function computeDistanceByPolyline(pos1, pos2) {
    if (!pos1 || !pos2) return Infinity;
    const line = new kakao.maps.Polyline({ path: [pos1, pos2] });
    return line.getLength();
  }

  function initMap() {
    map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(37.5665, 126.9780),
      level: 5
    });

    // 마커 이미지
    grayMarkerImage = new kakao.maps.MarkerImage(
      '/static/img/marker_trash_gray.png',
      new kakao.maps.Size(32, 40)
    );
    yellowMarkerImage = new kakao.maps.MarkerImage(
      '/static/img/marker_trash_yellow_outline_2px.png',
      new kakao.maps.Size(32, 42)
    );

    // 위치 가져오기 (지도 중심 설정 및 내 위치 마커)
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        userPosition = new kakao.maps.LatLng(lat, lon);
        map.setCenter(userPosition);

        // 내 위치 마커
        new kakao.maps.Marker({
          map: map,
          position: userPosition,
          title: '내 위치',
          image: new kakao.maps.MarkerImage(
            'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
            new kakao.maps.Size(24, 35)
          )
        });

        loadTrashcans(lat, lon);
      }, () => {
        alert('⚠️ 위치 정보를 가져오지 못했습니다. "서울시청"에서 출발로 설정합니다.');
        const defaultLat = 37.5665, defaultLon = 126.9780;
        userPosition = null;
        map.setCenter(new kakao.maps.LatLng(defaultLat, defaultLon));
        loadTrashcans(defaultLat, defaultLon);
      });
    }
  }

  kakao.maps.load(initMap);

  function loadTrashcans(lat, lon, radius = 10000000) {
    fetch(`/trash_loc/list/${districtId}/?lat=${lat}&lon=${lon}&radius=${radius}`)
      .then(res => res.json())
      .then(data => {
        markers.forEach(m => m.setMap(null));
        markers = [];
        trashList = [];

        data.forEach(trash => {
          if (!trash.t_lat || !trash.t_lon) return;
          const position = new kakao.maps.LatLng(trash.t_lat, trash.t_lon);
          const distance = computeDistanceByPolyline(userPosition || new kakao.maps.LatLng(lat, lon), position);
          if (!isFinite(distance)) return;
          trashList.push({ ...trash, distance });
        });

        trashList.sort((a, b) => a.distance - b.distance);

        const within100 = trashList.find(t => t.distance <= 100) || null;
        const within300 = trashList.find(t => t.distance > 100 && t.distance <= 300) || null;
        const within500 = trashList.find(t => t.distance > 300 && t.distance <= 500) || null;

        const recommended = [within100, within300, within500].filter(Boolean);

        trashList.forEach(trash => {
          const isRecommended = recommended.some(r =>
            r.t_lat.toFixed(6) === trash.t_lat.toFixed(6) &&
            r.t_lon.toFixed(6) === trash.t_lon.toFixed(6)
          );

          const marker = new kakao.maps.Marker({
            map: map,
            position: new kakao.maps.LatLng(trash.t_lat, trash.t_lon),
            title: trash.t_road_addr,
            image: isRecommended ? yellowMarkerImage : grayMarkerImage,
            clickable: true
          });

          kakao.maps.event.addListener(marker, 'click', () => showTrashDetail(trash));
          markers.push(marker);
        });

        displayRecommendationList(within100, within300, within500);
      })
      .catch(err => {
        console.error("쓰레기통 로드 실패:", err);
        alert("쓰레기통 데이터를 불러오는 데 실패했습니다.");
      });
  }

  function showTrashDetail(trash) {
    // 타입 표준화
    let type = trash.t_trash_type || "알 수 없음";
    if (type === "가로쓰레기통") type = "일반쓰레기통";
    if (type === "일반쓰레기") type = "일반쓰레기통";
    if (type === "재활용쓰레기") type = "재활용";

    const trashImageMap = {
      "재활용": "/static/img/recycle_bin.png",
      "일반쓰레기통": "/static/img/street_bin.png",
      "서리풀컵": "/static/img/seripoolcup.png"
    };
    const imageSrc = trash.t_image_url || trashImageMap[type] || "/static/images/trashcans/default.png";
    document.getElementById('trashImage').src = imageSrc;

    document.getElementById('trashAddressMain').innerText = trash.t_road_addr || '주소 정보 없음';

    const type1El = document.getElementById('type1');
    const type2El = document.getElementById('type2');

    // 일반쓰레기 블록
    if (type.includes("일반")) {
      type1El.style.display = 'flex';
      document.getElementById('type1-name').innerText = '일반쓰레기';
      document.getElementById('type1-loc').innerText = trash.t_loc ? '위치: ' + trash.t_loc : '';
    } else {
      type1El.style.display = 'none';
    }

    // 재활용 블록
    if (type.includes("재활용")) {
      type2El.style.display = 'flex';
      document.getElementById('type2-name').innerText = '재활용';
      document.getElementById('type2-loc').innerText = trash.t_recycle_loc ? '위치: ' + trash.t_recycle_loc : '';
    } else {
      type2El.style.display = 'none';
    }

    // 🔹 신고하기 버튼
    document.getElementById('btnReport').onclick = function () {
      if (!navigator.geolocation) {
        alert("⚠️ 위치 정보를 가져올 수 없습니다. 주소를 직접 입력해주세요.");
        window.location.href = `/complain_add/?address=${encodeURIComponent(trash.t_road_addr || "")}`;
        return;
      }

      navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        // 신고 페이지로 주소 + 위도/경도 전달
        const url = `/complain_add/?address=${encodeURIComponent(trash.t_road_addr || "")}&lat=${lat}&lon=${lon}`;
        window.location.href = url;

      }, () => {
        // 권한 거부 시 주소만 전달
        const url = `/complain_add/?address=${encodeURIComponent(trash.t_road_addr || "")}`;
        window.location.href = url;
      });
    };

    // 길찾기 버튼
    document.getElementById('btnFind').onclick = function () {
      const fromName = userPosition ? "내 위치" : "서울시청";
      const fromLat = userPosition ? userPosition.getLat() : 37.5665;
      const fromLon = userPosition ? userPosition.getLng() : 126.9780;
      const toName = trash.t_road_addr || "쓰레기통";
      const toLat = trash.t_lat;
      const toLon = trash.t_lon;
      const url = `https://map.kakao.com/link/from/${fromName},${fromLat},${fromLon}/to/${toName},${toLat},${toLon}`;
      window.open(url, "_blank");
    };

    document.getElementById('trashDetailModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('trashDetailModal').style.display = 'none';
  }


  /* 안전한 DOM 기반 추천 리스트 생성(기존 makeTrashHtml & displayRecommendationList 대체) */
  function createBinItem(trashObj, label, isClosest = false) {
    const item = document.createElement('div');
    item.className = 'bin-item' + (isClosest ? ' closest' : '');
    item.style.cursor = 'pointer';

    // left (icon + info)
    const left = document.createElement('div');
    left.className = 'bin-left';

    const img = document.createElement('img');
    img.src = '/static/img/marker_trash_yellow.png';
    img.alt = 'bin';
    img.className = 'bin-icon';
    left.appendChild(img);

    const info = document.createElement('div');
    info.className = 'bin-info';
    const strong = document.createElement('strong');
    strong.textContent = (label || '').replace(/^서울특별시\s*/, '');
    info.appendChild(strong);
    left.appendChild(info);

    // distance badge
    const distWrap = document.createElement('div');
    distWrap.className = 'bin-distance';
    const badge = document.createElement('span');
    badge.className = 'distance-badge' + (isClosest ? ' highlight' : '');
    const distText = (typeof trashObj.distance === 'number' && isFinite(trashObj.distance))
      ? Math.round(trashObj.distance) + 'm'
      : '-';
    badge.textContent = distText;
    distWrap.appendChild(badge);

    item.appendChild(left);
    item.appendChild(distWrap);

    // 안전하게 객체를 DOM 노드에 직접 저장 (문자열화 불필요)
    item.__trash = trashObj;

    // 클릭 시 showTrashDetail에 객체 전달
    item.addEventListener('click', function (ev) {
      if (ev && ev.preventDefault) ev.preventDefault();
      try {
        showTrashDetail(this.__trash);
      } catch (err) {
        console.error('showTrashDetail 실행 실패:', err);
      }
    });

    return item;
  }

  function displayRecommendationList(within100, within300, within500) {
    const container = document.getElementById('recommendationList');
    if (!container) return;

    // 안전하게 기존 내용 제거
    while (container.firstChild) container.removeChild(container.firstChild);

<!--    const header = document.createElement('h3');-->
<!--    header.style.marginBottom = '8px';-->
<!--    header.textContent = '📌 추천 쓰레기통';-->
<!--    container.appendChild(header);-->

    if (within100) {
      container.appendChild(createBinItem(within100, within100.t_road_addr || '이름 없음', true));
    } else {
      const p = document.createElement('p');
      p.className = 'no-bin';
      p.textContent = '100m 이내 없음';
      container.appendChild(p);
    }

    if (within300) {
      container.appendChild(createBinItem(within300, within300.t_road_addr || '이름 없음'));
    }

    if (within500) {
      container.appendChild(createBinItem(within500, within500.t_road_addr || '이름 없음'));
    }
  }

  </script>
  {% endblock %}
