{% extends 'nav_base.html' %}
{% block title %}쓰레기통 위치 안내{% endblock %}
{% block content %}
<!-- 지도 영역 -->
<div style="width:100%;height:220px;background:#f5f5f5;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:16px;">
  <!-- 실제 지도는 JS로 연동 예정 -->
  <span style="color:#888;">사용자 현재 위치와 주변 쓰레기통 위치 안내 지도</span>
</div>

<!-- 추천 쓰레기통 리스트 -->
<div style="margin:24px 0 0 0;">
  <b>추천 쓰레기통</b>
  <span style="font-size:12px;color:#888;">Click on a bin for more information</span>
  <ul style="list-style:none;padding:0;margin:16px 0 0 0;">
    <!-- 예시 데이터, 실제 데이터 연동 필요 -->
    <li style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;">
      <div>
        <b>Bin 1</b><br>
        <span style="font-size:12px;color:#888;">Type: Recycling</span>
      </div>
      <span style="font-size:15px;font-weight:bold;">100m</span>
    </li>
    <li style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;">
      <div>
        <b>Bin 2</b><br>
        <span style="font-size:12px;color:#888;">Type: General Waste</span>
      </div>
      <span style="font-size:15px;font-weight:bold;">250m</span>
    </li>
    <li style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;">
      <div>
        <b>Bin 3</b><br>
        <span style="font-size:12px;color:#888;">Type: Compost</span>
      </div>
      <span style="font-size:15px;font-weight:bold;">300m</span>
    </li>
  </ul>
</div>

<!-- 재검색 버튼 -->
<div style="display:flex;justify-content:center;margin:32px 0;">
  <button style="width:90%;max-width:340px;padding:12px 0;font-size:16px;border-radius:8px;border:1px solid #bbb;background:#fff;cursor:pointer;">재검색</button>
</div>

<!--
  // 추후 구현할 부분
  // - 실제 지도 연동(JS)
  // - 추천 쓰레기통 리스트 동적 데이터 연동
  // - 재검색 버튼 클릭 시 위치 재탐색 기능
-->
{% endblock %}
