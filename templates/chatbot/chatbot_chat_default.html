{% extends 'nav_base.html' %}
{% load static %}

{% block title %}챗봇{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'css/chatbot.css' %}">
{% endblock %}

{% block content %}
<div class="chatbot-container">
  <div class="scenario-buttons">
    <button class="scenario-btn" onclick="startScenario('trash_finder')">
      🗑️ 쓰레기통 찾기
    </button>
    <button class="scenario-btn" onclick="startScenario('complain_report')">
      📝 민원 제보하기
    </button>
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="chat-message assistant">
      <div class="message-bubble">
        <span class="icon">🤖</span>
        <span class="text">안녕하세요. AI오엘입니다! <br> 무엇을 도와드릴까요?</span>
      </div>
    </div>
    <div class="chat-message user">
      <div class="message-bubble">
        <span class="icon">🙋‍♀️</span>
        <span class="text">이 근처에 쓰레기통 있어?</span>
      </div>
    </div>
    <div class="chat-message assistant">
      <div class="message-bubble">
        <span class="icon">🤖</span>
        <span class="text">150m 근처에 쓰레기통이 2개 있습니다!</span>
      </div>
    </div>
  </div>

  <form class="chat-input" id="chatForm" method="post" enctype="multipart/form-data" onsubmit="return sendMessage()">
    {% csrf_token %}
    <input type="text" name="message" id="messageInput" placeholder="메시지를 입력하세요..." autocomplete="off" />
    <label for="fileUpload" class="file-label">📷</label>
    <input type="file" id="fileUpload" name="file" accept="image/*" capture="environment" style="display: none;" onchange="uploadFile()">
    <button type="submit">전송</button>
  </form>
</div>

<script>
// CSRF 토큰 가져오는 함수
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
      cookie = cookie.trim();
      if (cookie.startsWith(name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

const csrftoken = getCookie('csrftoken');

function startScenario(scenarioId) {
  appendMessage('assistant', `시나리오 "${scenarioId}"를 시작합니다.`);
  // TODO: 서버 요청으로 시나리오 초기화 가능
}

function appendMessage(role, text, imgUrl) {
  const chatWindow = document.getElementById('chatWindow');
  const msgDiv = document.createElement('div');
  msgDiv.className = `chat-message ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';

  const icon = document.createElement('span');
  icon.className = 'icon';
  icon.textContent = role === 'user' ? '🙋‍♀️' : '🤖';

  const content = document.createElement('span');
  content.className = 'text';
  if (imgUrl) {
    content.innerHTML = `<img src="${imgUrl}" alt="image" style="max-width:100px; max-height:100px;"><br>${text || ''}`;
  } else {
    content.textContent = text;
  }

  bubble.appendChild(icon);
  bubble.appendChild(content);
  msgDiv.appendChild(bubble);
  chatWindow.appendChild(msgDiv);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('messageInput');
  const message = input.value.trim();
  if (!message) return false;

  appendMessage('user', message);
  input.value = '';

  // 간단한 인사말 처리 (서버 요청 전)
  const lowerMsg = message.toLowerCase();
  const greetingResponses = {
    '안녕': '안녕하세요! 무엇을 도와드릴까요?',
    'hello': 'Hello! How can I help you?',
    '고마워': '천만에요! 도움이 되었다니 기뻐요 😊',
    '감사': '감사합니다! 언제든지 도와드릴게요.',
    '잘가': '안녕히 가세요! 또 만나요 👋',
    'bye': 'Goodbye! Take care!'
  };

  for (const key in greetingResponses) {
    if (lowerMsg.includes(key)) {
      setTimeout(() => {
        appendMessage('assistant', greetingResponses[key]);
      }, 600);
      return false;
    }
  }

  // 서버로 메시지 전송 (AJAX)
  const data = new FormData();
  data.append('message', message);
  data.append('user_id', 'web_user');  // 실제 로그인 유저 id로 변경 권장
  data.append('session_id', 'web-session');  // 실제 UUID로 변경 권장
  data.append('scenario_id', 'complain_submit');  // 또는 'trash_finder' 등

  fetch('/chat/api/', {
    method: 'POST',
    headers: {
      'X-CSRFToken': csrftoken
    },
    body: data
  })
  .then(response => response.json())
  .then(json => {
    if(json.response) {
      appendMessage('assistant', json.response);
    } else if(json.error) {
      appendMessage('assistant', `오류: ${json.error}`);
    }
  })
  .catch(err => {
    appendMessage('assistant', '서버와 통신 중 오류가 발생했습니다.');
    console.error(err);
  });

  return false;
}

function uploadFile() {
  const fileInput = document.getElementById('fileUpload');
  const file = fileInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function (e) {
    appendMessage('user', '', e.target.result);
  };
  reader.readAsDataURL(file);

  // TODO: FormData를 이용해 서버에 이미지 전송 처리
}
</script>
{% endblock %}
