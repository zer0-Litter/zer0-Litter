{% extends 'nav_base.html' %}
{% load static %}

{% block title %}챗봇{% endblock %}
{% block body_class %}chatbot-page{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.gl/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="{% static 'css/chatbot.css' %}">
{% endblock %}

{% block content %}
<div class="chatbot-container">
    <div class="chat-header-container">
      <div class="initial-greeting">
        <span>안녕하세요, AI 오엘입니다!</span> <br>
        <span>도움이 필요한 버튼을 눌러주세요.</span>
      </div>
      <div class="scenario-buttons-fixed">
        <button class="scenario-btn" onclick="startScenario('trash_finder')">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
          </svg>
          쓰레기통 찾기
        </button>
        <button class="scenario-btn" onclick="startScenario('complain_submit')">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
          </svg>
          민원 제보하기
        </button>
      </div>
    </div>

    <div class="chatbot-main">
        <div class="chat-window" id="chatWindow">
            </div>

        <form class="chat-input" id="chatForm" onsubmit="return handleFormSubmit(event)">
            {% csrf_token %}
            <textarea id="messageInput" placeholder="메시지를 입력하세요..." autocomplete="off" rows="1"></textarea>
            <input type="hidden" id="latitudeInput" name="latitude">
            <input type="hidden" id="longitudeInput" name="longitude">
            <div class="input-buttons">
                <label for="fileUpload" class="file-label">➕</label>
                <input type="file" id="fileUpload" name="file" accept="image/*" capture="environment" style="display:none;" onchange="uploadFile()">
                <button type="submit">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
                    </svg>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
// ---------------- CSRF 토큰 ----------------
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
      cookie = cookie.trim();
      if (cookie.startsWith(name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
const csrftoken = getCookie('csrftoken');

// ---------------- 세션, 시나리오 ----------------
let session_id = null;
let current_scenario = null;

// ---------------- 시나리오 선택 ----------------
function startScenario(scenarioId) {
  current_scenario = scenarioId;
  let messages = [];

  const initialAssistantMessage = document.querySelector('.initial-hidden');
  if (initialAssistantMessage) {
      initialAssistantMessage.style.display = 'flex';
      initialAssistantMessage.classList.remove('initial-hidden');
  }

  if (scenarioId === 'trash_finder') {
    messages = [
      '쓰레기통 찾기를 시작합니다.',
      '지도에서 현재 위치를 확인해주세요.'
    ];
  } else if (scenarioId === 'complain_submit') {
    messages = [
      '민원 제보를 시작하겠습니다.',
      '어떤 것을 도와드릴까요?'
    ];
  } else {
    messages = [`시나리오 "${scenarioId}"를 시작합니다.`];
  }

  appendMessage('assistant', messages.join('\n'));
}

// ---------------- 메시지 추가 (수정됨) ----------------
function appendMessage(role, text, imgUrl=null) {
  const chatWindow = document.getElementById('chatWindow');
  const msgDiv = document.createElement('div');
  msgDiv.className = `chat-message ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';

  const content = document.createElement('span');
  content.className = 'text';

  if (imgUrl) {
      content.innerHTML = `<img src="${imgUrl}" alt="image" style="max-width:100px; max-height:100px;">${text ? '<br>' + text : ''}`;
  } else {
      content.textContent = text;
  }

  bubble.appendChild(content);
  msgDiv.appendChild(bubble);
  chatWindow.appendChild(msgDiv);
  chatWindow.scrollTop = chatWindow.scrollHeight;

  return msgDiv;
}

// ---------------- fetch 호출 (수정됨) ----------------
function doFetch(formData) {
  const loadingMessageElement = appendMessage('assistant', '답변을 준비 중입니다...');

  fetch('/chatbot/chatbot_api/', {
    method: 'POST',
    headers: { 'X-CSRFToken': csrftoken },
    body: formData
  })
  .then(resp => {
    if (loadingMessageElement) {
        loadingMessageElement.remove();
    }
    return resp.json();
  })
  .then(json => {
    if (json.response) {
      appendMessage('assistant', json.response);
    }
    if (json.session_id) {
      session_id = json.session_id;
    }
  })
  .catch(err => {
    console.error("fetch 에러:", err);
    if (loadingMessageElement) {
        loadingMessageElement.remove();
    }
    appendMessage('assistant', '서버와 통신 중 오류가 발생했습니다.');
  });
}

// ---------------- 이미지 업로드 및 전송 ----------------
function uploadFile() {
  const fileInput = document.getElementById('fileUpload');
  const file = fileInput.files[0];
  if (!file) return;

  appendMessage('user', null, URL.createObjectURL(file));

  const data = new FormData();
  data.append('file', file);
  data.append('message', '');
  data.append('session_id', session_id || '');
  data.append('scenario_id', current_scenario || 'complain_submit');

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        data.append('lat', pos.coords.latitude);
        data.append('lon', pos.coords.longitude);
        doFetch(data);
      },
      err => doFetch(data)
    );
  } else {
    doFetch(data);
  }

  fileInput.value = '';
}

// ---------------- 텍스트 메시지 전송 로직 통합 ----------------
function sendTextMessage() {
  const input = document.getElementById('messageInput');
  const messageText = input.value.trim();
  if (!messageText) return;

  appendMessage('user', messageText);

  const data = new FormData();
  data.append('message', messageText);
  data.append('session_id', session_id || '');
  data.append('scenario_id', current_scenario || 'complain_submit');

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        data.append('lat', pos.coords.latitude);
        data.append('lon', pos.coords.longitude);
        doFetch(data);
      },
      err => doFetch(data)
    );
  } else {
    doFetch(data);
  }

  input.value = '';
}

// ---------------- 폼 제출 이벤트 핸들러 ----------------
function handleFormSubmit(e) {
  e.preventDefault();
  sendTextMessage();
  return false;
}

// ---------------- 엔터키 이벤트 핸들러 수정 ----------------
document.getElementById('messageInput').addEventListener('keydown', function(event) {
    if (event.keyCode === 13 && !event.shiftKey) {
        event.preventDefault();
        sendTextMessage();
    }
});
</script>
{% endblock %}
