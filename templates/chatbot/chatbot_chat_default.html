{% extends 'nav_base.html' %}
{% load static %}

{% block title %}챗봇{% endblock %}
{% block body_class %}chatbot-page{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="{% static 'css/chatbot.css' %}">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% endblock %}

{% block content %}
<div class="chatbot-container">
    <div class="chat-header-container">
      <div class="initial-greeting">
        <span>안녕하세요, AI 오엘입니다!</span> <br>
        <span>도움이 필요한 버튼을 눌러주세요.</span>
      </div>
      <div class="scenario-buttons-fixed">
        <button class="scenario-btn" onclick="startScenario('trash_finder')">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
          </svg>
          쓰레기통 찾기
        </button>
        <button class="scenario-btn" onclick="startScenario('complain_submit')">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
          </svg>
          민원 제보하기
        </button>
      </div>
      <input
        type="text"
        id="addressInput"
        placeholder="지도에서 주소를 선택해주세요"
        class="address-input"
        readonly
        style="display: none;"
      />
    </div>

    <div class="chatbot-main">
        <div class="chat-window" id="chatWindow">
            </div>

        <form class="chat-input" id="chatForm" onsubmit="return handleFormSubmit(event)">
            {% csrf_token %}
            <textarea id="messageInput" placeholder="메시지를 입력하세요..." autocomplete="off" rows="1"></textarea>
            <input type="hidden" id="latitudeInput" name="latitude">
            <input type="hidden" id="longitudeInput" name="longitude">
            <input type="hidden" id="comLocationInput" name="com_location">
            <div class="input-buttons">
                <label for="fileUpload" class="file-label">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                  </svg>
                </label>
                <input type="file" id="fileUpload" name="file" accept="image/*" capture="environment" style="display:none;" onchange="uploadFile()">
                <button type="submit">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
                    </svg>
                </button>
            </div>
        </form>
    </div>
    <input type="hidden" id="lat-input" name="lat">
    <input type="hidden" id="lon-input" name="lon">

    <div id="trashDetailModal" style="display:none;">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="trash-image">
          <img id="trashImage" src="/static/img/default_bin.png" alt="쓰레기통 사진">
        </div>
        <div class="trash-info">
          <h3 id="trashAddressMain">주소 정보 없음</h3>
          <div class="trash-type-wrap">
            <div class="trash-type" id="type1">
              <img src="/static/img/icon_trash.png" alt="">
              <div>
                <div class="type-name" id="type1-name">일반 쓰레기</div>
                <div class="type-loc" id="type1-loc">위치: -</div>
              </div>
            </div>
            <div class="trash-type" id="type2">
              <img src="/static/img/icon_recycle.png" alt="">
              <div>
                <div class="type-name" id="type2-name">재활용</div>
                <div class="type-loc" id="type2-loc">위치: -</div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-buttons">
          <button class="btn-find" id="btnFind">길찾기</button>
          <button class="btn-report" id="btnReport">신고하기</button>
        </div>
      </div>
    </div>
</div>

<script>

// ---------------- 전역 변수 ----------------
let map = null;
let userPosition = null;
let markers = [];
let grayMarkerImage, yellowMarkerImage;
let trashList = [];
const districtId = "{{ district_id }}";
console.log("🟡 districtId =", districtId);


// ---------------- CSRF 토큰 ----------------
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
      cookie = cookie.trim();
      if (cookie.startsWith(name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
const csrftoken = getCookie('csrftoken');


// -----polyline------
function computeDistanceByPolyline(pos1, pos2) {
  if (!pos1 || !pos2) return Infinity;
  const line = new kakao.maps.Polyline({ path: [pos1, pos2] });
  return line.getLength();
}

// ---------------- Kakao SDK 안전 로드 ----------------
console.log("Kakao SDK 로드 시작");

function loadKakaoSdk(callback) {
  if (window.kakao && window.kakao.maps) {
    console.log("✅ Kakao SDK 이미 로드됨");
    callback();
    return;
  }

  const script = document.createElement("script");
  script.src =
    "https://dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_api_key }}&autoload=false&libraries=services";

  script.onload = () => {
    console.log("✅ Kakao SDK 로드 완료");
    kakao.maps.load(callback);
  };

  script.onerror = () => {
    console.error("❌ Kakao SDK 로드 실패");
  };

  document.head.appendChild(script);
}

// ---------------- 기본 지도 메시지 생성 ----------------
function appendMapMessage() {
  console.log("📍 appendMapMessage 호출됨");
  const chatBox = document.getElementById("chatWindow");
  if (!chatBox) return;

  // ✅ 중복 지도/주소 제거
  const oldMap = document.getElementById("chatbotMap");
  if (oldMap) oldMap.closest('.chat-message').remove(); // 지도 전체 버블 제거

  // ✅ 지도/주소 버블 생성 (Assistant 메시지처럼 보이도록)
  const mapMsgDiv = document.createElement('div');
  mapMsgDiv.className = `chat-message assistant map-message`; // 새로운 클래스 추가
  // 💡 [수정] 지도 메시지 컨테이너의 최대 폭을 크게 설정
  mapMsgDiv.style.maxWidth = 'calc(100% - 10px)'; // 챗윈도우 폭에 거의 가깝게 확장

  const mapBubble = document.createElement('div');
  mapBubble.className = 'message-bubble map-bubble';
  // 💡 [수정] 버블의 폭을 100%로 설정하여 부모(mapMsgDiv)의 확장된 폭을 따름
  mapBubble.style.width = '100%';
  mapMsgDiv.appendChild(mapBubble);

  // ✅ 지도 DOM 생성
  const mapContainer = document.createElement("div");
  mapContainer.id = "chatbotMap";
  mapContainer.style.width = "100%";
  mapContainer.style.height = "160px";
  mapContainer.style.borderRadius = "10px"; // 버블 안에 들어가므로 약간 작게
  mapContainer.style.position = "relative";
  mapBubble.appendChild(mapContainer);

  // ✅ 주소 입력창과 버튼을 감싸는 컨테이너 생성 (주소 입력창 옆에 버튼을 넣기 위해)
  const addressConfirmContainer = document.createElement('div');
  addressConfirmContainer.className = 'address-confirm-container';
  // 💡 [수정] 주소/버튼 컨테이너의 폭도 100%로 설정
  addressConfirmContainer.style.width = '100%';
  mapBubble.appendChild(addressConfirmContainer);

  // ✅ 주소 입력창 (지도 바로 아래에 오도록)
  const addressInput = document.createElement('input');
  addressInput.type = 'text';
  addressInput.id = 'addressInputOnChat'; // 챗윈도우 내부의 ID로 구분
  addressInput.placeholder = '마커를 움직여 현 위치를 선택해주세요';
  addressInput.className = 'address-input';
  addressInput.readOnly = true;
  // ❌ [제거] 인라인 마진 제거 (CSS 파일에서 처리하거나, 'address-confirm-container'가 처리하도록 위임)
  addressInput.style.marginTop = '0';
  addressInput.style.marginBottom = '0';
  addressInput.style.marginLeft = '0';
  addressInput.style.marginRight = '0';
  addressConfirmContainer.appendChild(addressInput);

  // ✅ 확인 버튼 생성
  const confirmButton = document.createElement('button');
  confirmButton.textContent = '확인';
  confirmButton.id = 'confirmLocationBtn';
  confirmButton.className = 'confirm-button'; // CSS 스타일링을 위한 클래스
  addressConfirmContainer.appendChild(confirmButton);

  chatBox.appendChild(mapMsgDiv);
  chatBox.scrollTop = chatBox.scrollHeight;

  // 💡 [추가] 확인 버튼 클릭 이벤트 리스너
  confirmButton.addEventListener('click', () => {
      const currentAddress = document.getElementById('addressInputOnChat').value;
      if (currentAddress && currentAddress !== '마커를 움직여 현 위치를 선택해주세요') {
          // 챗봇 대화창에 사용자 메시지 출력
          appendMessage('user', `현재 ${currentAddress} 에 있어.`);

          // 사용자가 확인했으므로 버튼 비활성화 (선택 사항)
          confirmButton.disabled = true;
          confirmButton.textContent = '확인 완료';
          confirmButton.style.backgroundColor = '#ccc';
      } else {
          alert('먼저 지도에서 위치를 확인하여 주소를 입력해주세요.');
      }
  });

  // ✅ 지도 초기화
  map = new kakao.maps.Map(mapContainer, {
    center: new kakao.maps.LatLng(37.5665, 126.9780),
    level: 5,
  });

  // ✅ 마커 이미지 로드 (기존 로직 유지)
  grayMarkerImage = new kakao.maps.MarkerImage(
    "/static/img/marker_trash_gray.png",
    new kakao.maps.Size(32, 40)
  );
  yellowMarkerImage = new kakao.maps.MarkerImage(
    "/static/img/marker_trash_yellow_outline_2px.png",
    new kakao.maps.Size(32, 42)
  );

  // ✅ 중앙 핑 고정
  const centerPin = document.createElement("div");
  centerPin.id = "fixed-pin";
  mapContainer.appendChild(centerPin);

  // geocoder 생성
  const geocoder = new kakao.maps.services.Geocoder();

  // ✅ 현재 위치 가져오기 및 초기 지도/주소 설정
  if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          userPosition = new kakao.maps.LatLng(lat, lon);
          map.setCenter(userPosition);

          document.getElementById('latitudeInput').value = lat;
          document.getElementById('longitudeInput').value = lon;

          loadTrashcans(lat, lon);
          updateAddressInput(userPosition);
        }, () => {
          setDefaultCenter();
        });
      } else {
        setDefaultCenter();
      }

  // ✅ 지도 움직일 때마다 중심 좌표를 hidden input에 업데이트
  kakao.maps.event.addListener(map, 'center_changed', function () {
        const center = map.getCenter();
        const lat = center.getLat();
        const lon = center.getLng();

        // hidden input 업데이트
        document.getElementById('latitudeInput').value = lat;
        document.getElementById('longitudeInput').value = lon;

        // 지도 중앙 좌표 → 주소 변환
        updateAddressInput(center);
    });

  // 주소 업데이트 함수
  function updateAddressInput(latlng) {
      geocoder.coord2Address(latlng.getLng(), latlng.getLat(), function(result, status) {
          if (status === kakao.maps.services.Status.OK) {
              let addr = "";
              const regionMap = { /* ... (지역 보정 맵) */
                  "서울": "서울특별시",
                  "부산": "부산광역시",
                  "대구": "대구광역시",
                  "인천": "인천광역시",
                  "광주": "광주광역시",
                  "대전": "대전광역시",
                  "울산": "울산광역시",
                  "세종": "세종특별자치시",
                  "경기": "경기도",
                  "강원": "강원도",
                  "충북": "충청북도",
                  "충남": "충청남도",
                  "전북": "전라북도",
                  "전남": "전라남도",
                  "경북": "경상북도",
                  "경남": "경상남도",
                  "제주": "제주특별자치도"
              };

              if (result[0].road_address) {
                  addr = result[0].road_address.address_name;
              }
              else if (result[0].address) {
                  const addressInfo = result[0].address;
                  let region1 = regionMap[addressInfo.region_1depth_name] || addressInfo.region_1depth_name;
                  addr = region1;
                  if (addressInfo.region_2depth_name) addr += " " + addressInfo.region_2depth_name;
                  if (addressInfo.region_3depth_name) addr += " " + addressInfo.region_3depth_name;
                  if (addressInfo.main_address_no) addr += " " + addressInfo.main_address_no;
                  if (addressInfo.sub_address_no) addr += "-" + addressInfo.sub_address_no;
              }

              // 🔹 HIDDEN INPUT 채우기 (백엔드 전송용)
              document.getElementById('comLocationInput').value = addr;

              // 🔹 챗윈도우 내부 주소 입력창 업데이트 (사용자 확인용)
              const addressInputInChat = document.getElementById('addressInputOnChat');
              if (addressInputInChat) {
                  addressInputInChat.value = addr;
              }

              // 🔹 (이전) 헤더 컨테이너의 주소 입력창도 업데이트 (만약 사용된다면)
              const addressInputInHeader = document.getElementById('addressInput');
              if (addressInputInHeader) {
                  addressInputInHeader.value = addr;
              }
          }
      });
  }
}

// ---------------- 중심좌표 맞추기 ----------------
function setDefaultCenter() {
  const defaultLat = 37.5665, defaultLon = 126.9780;
  console.warn("⚠️ 기본 좌표로 설정", defaultLat, defaultLon);
  userPosition = new kakao.maps.LatLng(defaultLat, defaultLon);
  map.setCenter(userPosition);

  document.getElementById('lat-input').value = defaultLat;
  document.getElementById('lon-input').value = defaultLon;

  console.log("🟢 setDefaultCenter에서 loadTrashcans 호출");
  loadTrashcans(defaultLat, defaultLon);

}

// ---------------- 쓰레기통 로드 ----------------
function loadTrashcans(lat, lon, radius = 10000) {
      console.log("🟢 loadTrashcans 호출됨", lat, lon, districtId);
      fetch(`/trash_loc/list/${districtId}/?lat=${lat}&lon=${lon}&radius=${radius}`)
        .then(res => res.json())
        .then(data => {
          console.log('🚀 fetch data:', data);
          markers.forEach(m => m.setMap(null));
          markers = [];
          trashList = [];

          data.forEach(trash => {
            if (!trash.t_lat || !trash.t_lon) return;
            const position = new kakao.maps.LatLng(trash.t_lat, trash.t_lon);
            const distance = computeDistanceByPolyline(userPosition || new kakao.maps.LatLng(lat, lon), position);
            if (!isFinite(distance)) return;
            trashList.push({ ...trash, distance });
          });

          trashList.forEach(trash => {
            const position = new kakao.maps.LatLng(trash.t_lat, trash.t_lon);
            const marker = new kakao.maps.Marker({
              map: map,
              position: position,
              title: trash.t_road_addr,
              image: grayMarkerImage, // 추천 마커는 나중에 따로 처리
              clickable: true
            });

            kakao.maps.event.addListener(marker, 'click', () => showTrashDetail(trash));
            markers.push(marker);
          });
         });
    }

    function showTrashDetail(trash) {
      // 타입 표준화
      let type = trash.t_trash_type || "알 수 없음";
      if (type === "가로쓰레기통") type = "일반쓰레기통";
      if (type === "일반쓰레기") type = "일반쓰레기통";
      if (type === "재활용쓰레기") type = "재활용";

      const trashImageMap = {
        "재활용": "/static/img/recycle_bin.png",
        "일반쓰레기통": "/static/img/street_bin.png",
        "서리풀컵": "/static/img/seripoolcup.png"
      };
      const imageSrc = trash.t_image_url || trashImageMap[type] || "/static/images/trashcans/default.png";
      document.getElementById('trashImage').src = imageSrc;

      document.getElementById('trashAddressMain').innerText = trash.t_road_addr || '주소 정보 없음';

      const type1El = document.getElementById('type1');
      const type2El = document.getElementById('type2');

      // 일반쓰레기 블록
      if (type.includes("일반")) {
        type1El.style.display = 'flex';
        document.getElementById('type1-name').innerText = '일반쓰레기';
        document.getElementById('type1-loc').innerText = trash.t_loc ? '위치: ' + trash.t_loc : '';
      } else {
        type1El.style.display = 'none';
      }

      // 재활용 블록
      if (type.includes("재활용")) {
        type2El.style.display = 'flex';
        document.getElementById('type2-name').innerText = '재활용';
        document.getElementById('type2-loc').innerText = trash.t_recycle_loc ? '위치: ' + trash.t_recycle_loc : '';
      } else {
        type2El.style.display = 'none';
      }

      // 🔹 신고하기 버튼
      document.getElementById('btnReport').onclick = function () {
        if (!navigator.geolocation) {
          alert("⚠️ 위치 정보를 가져올 수 없습니다. 주소를 직접 입력해주세요.");
          window.location.href = `/complain_add/?address=${encodeURIComponent(trash.t_road_addr || "")}`;
          return;
        }

        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          // 신고 페이지로 주소 + 위도/경도 전달
          const url = `/complain_add/?address=${encodeURIComponent(trash.t_road_addr || "")}&lat=${lat}&lon=${lon}`;
          window.location.href = url;

        }, () => {
          // 권한 거부 시 주소만 전달
          const url = `/complain_add/?address=${encodeURIComponent(trash.t_road_addr || "")}`;
          window.location.href = url;
        });
      };

      // 길찾기 버튼
      document.getElementById('btnFind').onclick = function () {
        const fromName = userPosition ? "내 위치" : "서울시청";
        const fromLat = userPosition ? userPosition.getLat() : 37.5665;
        const fromLon = userPosition ? userPosition.getLng() : 126.9780;
        const toName = trash.t_road_addr || "쓰레기통";
        const toLat = trash.t_lat;
        const toLon = trash.t_lon;
        const url = `https://map.kakao.com/link/from/${fromName},${fromLat},${fromLon}/to/${toName},${toLat},${toLon}`;
        window.open(url, "_blank");
      };

      document.getElementById('trashDetailModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('trashDetailModal').style.display = 'none';
    }


// ---------------- 세션, 시나리오 ----------------
let session_id = null;
let current_scenario = null;

// ---------------- 시나리오 선택 ----------------
function startScenario(scenarioId) {
  // ✅ 핵심 수정: 시나리오 시작 시 주소 입력창(헤더의)은 숨기고,
  // 지도와 주소 입력창을 chat-window 내에 메시지로 출력합니다.
  const headerAddressInput = document.getElementById('addressInput');
  if (headerAddressInput) {
      headerAddressInput.style.display = 'none';
  }

  current_scenario = scenarioId;
  let messages = [];

  const initialAssistantMessage = document.querySelector('.initial-hidden');
  if (initialAssistantMessage) {
      initialAssistantMessage.style.display = 'flex';
      initialAssistantMessage.classList.remove('initial-hidden');
  }

  if (scenarioId === 'trash_finder') {
    messages = [
      '지도에서 현 위치를 확인하고,',
      '쓰레기통을 눌러서 길을 찾을 수 있어요.'
    ];
    // 💡 변경: 메시지 배열을 순회하며 개별적으로 출력
    messages.forEach(msg => {
        appendMessage('assistant', msg);
    });
    // ✅ 지도/주소 로직을 chat-window 내 메시지로 출력
    loadKakaoSdk(() => {
        appendMapMessage(); // 지도와 주소 입력창이 포함된 메시지 버블을 추가
    });

  } else if (scenarioId === 'complain_submit') {
    messages = [
      '지도에서 현재 위치가 맞으면 확인을 눌러주세요.',
      '아니면 마커를 움직여서 현 위치를 확인해주세요.'
    ];
    // 💡 변경: 메시지 배열을 순회하며 개별적으로 출력
    messages.forEach(msg => {
        appendMessage('assistant', msg);
    });
    // ✅ 지도/주소 로직을 chat-window 내 메시지로 출력
    loadKakaoSdk(() => {
        appendMapMessage(); // 지도와 주소 입력창이 포함된 메시지 버블을 추가
    });
  } else {
    // 💡 변경: 단일 메시지도 appendMessage를 직접 호출하도록 변경
    appendMessage('assistant', `시나리오 "${scenarioId}"를 시작합니다.`);
  }
}

// ---------------- 메시지 추가 (수정됨) ----------------
function appendMessage(role, text, imgUrl=null) {
  const chatWindow = document.getElementById('chatWindow');
  const msgDiv = document.createElement('div');
  msgDiv.className = `chat-message ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';

  const content = document.createElement('span');
  content.className = 'text';

  if (imgUrl) {
      content.innerHTML = `<img src="${imgUrl}" alt="image" style="max-width:100px; max-height:100px;">${text ? '<br>' + text : ''}`;
  } else {
      content.textContent = text;
  }

  bubble.appendChild(content);
  msgDiv.appendChild(bubble);
  chatWindow.appendChild(msgDiv);
  chatWindow.scrollTop = chatWindow.scrollHeight;

  return msgDiv;
}

// ---------------- fetch 호출 (수정됨) ----------------
function doFetch(formData) {
  const loadingMessageElement = appendMessage('assistant', '답변을 준비 중입니다...');

  fetch('/chatbot/chatbot_api/', {
    method: 'POST',
    headers: { 'X-CSRFToken': csrftoken },
    body: formData
  })
  .then(resp => {
    if (loadingMessageElement) {
        loadingMessageElement.remove();
    }
    return resp.json();
  })
  .then(json => {
    if (json.response) {
      appendMessage('assistant', json.response);
    }
    if (json.session_id) {
      session_id = json.session_id;
    }
  })
  .catch(err => {
    console.error("fetch 에러:", err);
    if (loadingMessageElement) {
        loadingMessageElement.remove();
    }
    appendMessage('assistant', '서버와 통신 중 오류가 발생했습니다.');
  });
}

// ---------------- 이미지 업로드 및 전송 ----------------
function uploadFile() {
  const fileInput = document.getElementById('fileUpload');
  const file = fileInput.files[0];
  if (!file) return;

  appendMessage('user', null, URL.createObjectURL(file));

  const data = new FormData();
  data.append('file', file);
  data.append('message', '');
  data.append('session_id', session_id || '');
  data.append('scenario_id', current_scenario || 'complain_submit');

  // 주소 필드 추가
  const comLocation = document.getElementById('comLocationInput').value;
  data.append('com_location', comLocation);


  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        data.append('lat', pos.coords.latitude);
        data.append('lon', pos.coords.longitude);
        doFetch(data);
      },
      err => doFetch(data)
    );
  } else {
    doFetch(data);
  }

  fileInput.value = '';
}

// ---------------- 텍스트 메시지 전송 로직 통합 ----------------
function sendTextMessage() {
  const input = document.getElementById('messageInput');
  const messageText = input.value.trim();
  if (!messageText) return;

  appendMessage('user', messageText);

  const data = new FormData();
  data.append('message', messageText);
  data.append('session_id', session_id || '');
  data.append('scenario_id', current_scenario || 'complain_submit');

  // 주소 필드 추가
  const comLocation = document.getElementById('comLocationInput').value;
  data.append('com_location', comLocation);


  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        data.append('lat', pos.coords.latitude);
        data.append('lon', pos.coords.longitude);
        doFetch(data);
      },
      err => doFetch(data)
    );
  } else {
    doFetch(data);
  }

  input.value = '';
}

// ---------------- 폼 제출 이벤트 핸들러 ----------------
function handleFormSubmit(e) {
  e.preventDefault();
  sendTextMessage();
  return false;
}

// ---------------- 엔터키 이벤트 핸들러 수정 ----------------
document.getElementById('messageInput').addEventListener('keydown', function(event) {
    if (event.keyCode === 13 && !event.shiftKey) {
        event.preventDefault();
        sendTextMessage();
    }
});
</script>
