{% extends 'nav_base.html' %}
{% load static %}

{% block title %}회원가입{% endblock %}

{% block content %}
<link rel="stylesheet" type="text/css" href="{% static 'css/register.css' %}">

<div class="register-container">
    <div class="top-bar">
        <a href="{% url 'accounts:login' %}" class="back-arrow">&larr;</a>
        <span class="top-title">회원가입</span>
    </div>

    <form method="POST" action="{% url 'accounts:register' %}" id="register-form">
        {% csrf_token %}

        <div class="form-group id-group">
            <label for="username">아이디</label>
            <div class="id-input-wrap">
                <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
                <button type="button" class="check-btn" id="check-duplicate-btn">중복 확인</button>
            </div>
            <div class="status-text" id="duplicate-status"></div>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="영문 소문자, 숫자, 기호 조합 8~16자" required />
        </div>

        <div class="form-group">
            <label for="password2">비밀번호 확인</label>
            <input type="password" id="password2" name="password2" placeholder="위와 동일한 비밀번호를 다시 입력하세요" required />
        </div>

        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required />
        </div>

        <div class="form-group">
            <label for="birth">생년월일</label>
            <input type="date" id="birth" name="birth" required />
        </div>

        <div class="form-group">
            <label for="gender">성별</label>
            <div class="gender-options">
                <input type="radio" id="male" name="gender" value="남성" />
                <label for="male">남자</label>

                <input type="radio" id="female" name="gender" value="여성" />
                <label for="female">여자</label>

                <input type="radio" id="other" name="gender" value="기타" />
                <label for="other">기타</label>
            </div>
        </div>

        <div class="form-group">
          <label for="address">주소</label>
          <select id="address" name="address" required>
            <option value="">-- 주소 선택 --</option>
            <option value="서울특별시 강남구">서울특별시 강남구</option>
            <option value="서울특별시 강동구">서울특별시 강동구</option>
            <option value="서울특별시 강북구">서울특별시 강북구</option>
            <option value="서울특별시 강서구">서울특별시 강서구</option>
            <option value="서울특별시 관악구">서울특별시 관악구</option>
            <option value="서울특별시 광진구">서울특별시 광진구</option>
            <option value="서울특별시 구로구">서울특별시 구로구</option>
            <option value="서울특별시 금천구">서울특별시 금천구</option>
            <option value="서울특별시 노원구">서울특별시 노원구</option>
            <option value="서울특별시 도봉구">서울특별시 도봉구</option>
            <option value="서울특별시 동대문구">서울특별시 동대문구</option>
            <option value="서울특별시 동작구">서울특별시 동작구</option>
            <option value="서울특별시 마포구">서울특별시 마포구</option>
            <option value="서울특별시 서대문구">서울특별시 서대문구</option>
            <option value="서울특별시 서초구">서울특별시 서초구</option>
            <option value="서울특별시 성동구">서울특별시 성동구</option>
            <option value="서울특별시 성북구">서울특별시 성북구</option>
            <option value="서울특별시 송파구">서울특별시 송파구</option>
            <option value="서울특별시 양천구">서울특별시 양천구</option>
            <option value="서울특별시 영등포구">서울특별시 영등포구</option>
            <option value="서울특별시 용산구">서울특별시 용산구</option>
            <option value="서울특별시 은평구">서울특별시 은평구</option>
            <option value="서울특별시 종로구">서울특별시 종로구</option>
            <option value="서울특별시 중구">서울특별시 중구</option>
            <option value="서울특별시 중랑구">서울특별시 중랑구</option>
          </select>
        </div>

        <div class="form-group">
          <label for="phone_number">전화번호</label>
          <input
            type="text"
            id="phone_number"
            name="phone_number"
            placeholder="전화번호를 입력하세요"
            oninput="formatPhoneNumber(this)"
            maxlength="13"
            required
            pattern="^\d{2,3}-?\d{3,4}-?\d{4}$"
          />
        </div>

        <div class="terms-container">
          <p class="terms-desc">개인정보 수집 및 이용 동의</p>
          <div class="terms-check">
            <input type="checkbox" name="agree" required>
            <span>개인정보 수집 및 이용 동의에 동의합니다.</span>
          </div>
        </div>

        <div class="button-row">
              <button type="submit" class="register-btn">회원가입</button>
              <a href="{% url 'accounts:login' %}" class="back-btn">이전으로</a>
          </div>
    </form>
</div>

{% if messages %}
  {% for message in messages %}
    {% if message %}
      <script>
        window.addEventListener('DOMContentLoaded', () => {
          showModal(`{{ message|escapejs }}`);
        });
      </script>
    {% endif %}
  {% endfor %}
{% endif %}


<script>
    document.getElementById('check-duplicate-btn').addEventListener('click', function () {
        const username = document.getElementById('username').value;
        fetch("{% url 'accounts:check_user_id' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify({ username: username })
        })
        .then(response => response.json())
        .then(data => {
            const status = document.getElementById('duplicate-status');
            if (data.is_taken) {
                status.textContent = '아이디가 이미 존재합니다.';
                status.style.color = 'red';
            } else {
                status.textContent = '사용 가능한 아이디입니다.';
                status.style.color = 'green';
            }
        })
        .catch(() => {
            document.getElementById('duplicate-status').textContent = '오류 발생';
        });
    });

    document.getElementById('register-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const form = event.target;

      // ★ 브라우저 기본검증(필수/패턴) 먼저 수행 → 실패하면 기본 풍선("이 입력란을 작성하세요") 표시
      if (!form.reportValidity()) return;

      const submitBtn = form.querySelector('button[type="submit"]');
      const formData = new FormData(form);
      submitBtn.disabled = true; // 중복 제출 방지

      fetch("{% url 'accounts:register' %}", {
        method: 'POST',
        body: formData
      })
      .then(response => response.json().then(data => ({ status: response.status, body: data })))
      .then(({ status, body }) => {
        if (status === 201) {
          showModal(`${body.username}님 가입을 환영합니다!<br>로그인 후 다양한 서비스를 이용해보세요.`);
          setTimeout(() => { window.location.href = "{% url 'accounts:login' %}"; }, 1500);
        } else {
          let errors = '';
          for (const key in body) {
            errors += Array.isArray(body[key]) ? body[key].join('<br>') + '<br>' : body[key] + '<br>';
          }
          showModal(errors || '가입에 실패했습니다.');
        }
      })
      .catch(() => { showModal('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.'); })
      .finally(() => { submitBtn.disabled = false; });
    });

    function formatPhoneNumber(input) {
        let numbers = input.value.replace(/\D/g, '');
        let formatted = '';

        if (numbers.length < 4) {
            formatted = numbers;
        } else if (numbers.length < 7) {
            formatted = numbers.slice(0, 3) + '-' + numbers.slice(3);
        } else if (numbers.length <= 10) {
            formatted = numbers.slice(0, 3) + '-' + numbers.slice(3, 6) + '-' + numbers.slice(6);
        } else {
            formatted = numbers.slice(0, 3) + '-' + numbers.slice(3, 7) + '-' + numbers.slice(7, 11);
        }

        input.value = formatted;
    }
</script>


{% endblock %}
