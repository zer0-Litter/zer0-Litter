{% extends 'nav_base.html' %}

{% block title %}회원가입{% endblock %}

{% block content %}
  <h1>회원가입</h1>

  <!-- 회원가입 폼 -->
  <form method="POST" action="{% url 'accounts:register' %}" id="register-form">
    {% csrf_token %}
    
    <div>
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" required placeholder="아이디를 입력하세요" />
      <button type="button" id="check-duplicate-btn">중복 확인</button> <!-- 중복 확인 버튼 추가 -->
      <span id="duplicate-status"></span> <!-- 중복 여부 표시 -->
    </div>

    <div>
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" required placeholder="영문 소문자, 숫자, 기호 조합 8~16자" style="width:60%;" />
    </div>

    <div>
      <label for="password2">비밀번호 확인</label>
      <input type="password" id="password2" name="password2" required placeholder="위와 동일한 비밀번호를 다시 입력하세요" style="width:60%;" />
    </div>

    <div>
      <label for="name">이름</label>
      <input type="text" id="name" name="name" required placeholder="이름을 입력하세요" />
    </div>

    <div>
      <label for="birth">생년월일</label>
      <input type="date" id="birth" name="birth" required placeholder="YYYY-MM-DD" />
    </div>

    <div>
      <label>성별</label><br>
      <input type="radio" id="male" name="gender" value="male" required />
      <label for="male">남성</label><br>
      <input type="radio" id="female" name="gender" value="female" required />
      <label for="female">여성</label><br>
      <input type="radio" id="other" name="gender" value="other" required />
      <label for="other">기타</label><br>
    </div>

    <div>
      <label for="address">주소</label>
      <select id="address" name="address" required>
        <option value="">-- 주소 선택 --</option>
        <option value="서울특별시 강남구">서울특별시 강남구</option>
        <option value="서울특별시 강동구">서울특별시 강동구</option>
        <option value="서울특별시 강북구">서울특별시 강북구</option>
        <option value="서울특별시 강서구">서울특별시 강서구</option>
        <option value="서울특별시 관악구">서울특별시 관악구</option>
        <option value="서울특별시 광진구">서울특별시 광진구</option>
        <option value="서울특별시 구로구">서울특별시 구로구</option>
        <option value="서울특별시 금천구">서울특별시 금천구</option>
        <option value="서울특별시 노원구">서울특별시 노원구</option>
        <option value="서울특별시 도봉구">서울특별시 도봉구</option>
        <option value="서울특별시 동대문구">서울특별시 동대문구</option>
        <option value="서울특별시 동작구">서울특별시 동작구</option>
        <option value="서울특별시 마포구">서울특별시 마포구</option>
        <option value="서울특별시 서대문구">서울특별시 서대문구</option>
        <option value="서울특별시 서초구">서울특별시 서초구</option>
        <option value="서울특별시 성동구">서울특별시 성동구</option>
        <option value="서울특별시 성북구">서울특별시 성북구</option>
        <option value="서울특별시 송파구">서울특별시 송파구</option>
        <option value="서울특별시 양천구">서울특별시 양천구</option>
        <option value="서울특별시 영등포구">서울특별시 영등포구</option>
        <option value="서울특별시 용산구">서울특별시 용산구</option>
        <option value="서울특별시 은평구">서울특별시 은평구</option>
        <option value="서울특별시 종로구">서울특별시 종로구</option>
        <option value="서울특별시 중구">서울특별시 중구</option>
        <option value="서울특별시 중랑구">서울특별시 중랑구</option>
      </select>
    </div>

    <div>
      <label for="phone_number">전화번호</label>
      <input type="text" id="phone_number" name="phone_number" required placeholder="전화번호를 입력하세요" />
    </div>

    <div>
      <label>
        <input type="checkbox" name="privacy_agree" required /> 개인정보 수집 및 이용 동의
      </label>
      <p>개인정보 수집 및 이용 동의에 동의합니다.</p>
    </div>

    <button type="submit">회원가입</button>
  </form>

  <!-- ✅ 모달창 (성공 / 실패 공통) -->
  <div id="modal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
       background: white; border: 1px solid #aaa; border-radius: 10px; padding: 20px; z-index: 999;">
    <div class="modal-content">
      <span id="close-btn" style="cursor: pointer; float: right;">&times;</span>
      <h3 id="modal-message" style="margin-top: 10px;"></h3>
    </div>
  </div>

  <script>
    // 아이디 중복 확인
    document.getElementById('check-duplicate-btn').addEventListener('click', function () {
      const username = document.getElementById('username').value;

      fetch("{% url 'accounts:check_user_id' %}", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify({ username: username })
      })
        .then(response => response.json())
        .then(data => {
          const status = document.getElementById('duplicate-status');
          if (data.is_taken) {
            status.textContent = '아이디가 이미 존재합니다.';
            status.style.color = 'red';
          } else {
            status.textContent = '사용 가능한 아이디입니다.';
            status.style.color = 'green';
          }
        })
        .catch(() => {
          document.getElementById('duplicate-status').textContent = '오류 발생';
          document.getElementById('duplicate-status').style.color = 'red';
        });
    });

    // 회원가입 폼 제출
    document.getElementById('register-form').addEventListener('submit', function (event) {
      event.preventDefault();

      const formData = new FormData(event.target);

      fetch("{% url 'accounts:register' %}", {
        method: 'POST',
        body: formData
      })
        .then(response =>
          response.json().then(data => ({
            status: response.status,
            body: data
          }))
        )
        .then(({ status, body }) => {
          const modal = document.getElementById('modal');
          const messageBox = document.getElementById('modal-message');

          if (status === 201) {
            // 성공 시
            messageBox.innerHTML = `${body.username} 가입해주셔서 감사합니다.`;
            modal.style.display = 'block';
            setTimeout(() => {
              window.location.href = "{% url 'accounts:login' %}";
            }, 2000);
          } else {
            // 실패 시: 에러 메시지 표시
            let errors = '';
            for (const key in body) {
              if (Array.isArray(body[key])) {
                errors += body[key].join('<br>') + '<br>';
              } else {
                errors += body[key] + '<br>';
              }
            }
            messageBox.innerHTML = errors;
            modal.style.display = 'block';
          }
        })
        .catch(() => {
          document.getElementById('modal-message').textContent = '가입 중 오류가 발생했습니다.';
          document.getElementById('modal').style.display = 'block';
        });
    });

    // 모달 닫기
    document.getElementById('close-btn').addEventListener('click', function () {
      document.getElementById('modal').style.display = 'none';
    });
  </script>

{% endblock %}
