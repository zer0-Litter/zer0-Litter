{% extends 'nav_base.html' %}

{% block title %}로그인{% endblock %}

{% block content %}
  <h1>로그인</h1>

  <!-- 로그인 폼 -->
  <form method="POST" action="{% url 'accounts:login_view' %}" id="login-form">
    {% csrf_token %}
    <div>
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" required placeholder="아이디" />
    </div>
    <div>
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" required placeholder="비밀번호" />
    </div>
    <button type="submit">로그인</button>
  </form>

  <!-- 회원가입 페이지로 이동하는 링크 추가 -->
  <p>회원가입이 아직 안되셨나요? <a href="{% url 'accounts:register' %}">회원가입</a></p>

  <!-- 모달 창 -->
  <div id="modal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.5); padding: 20px; border-radius: 10px;">
    <div class="modal-content">
        <span id="close-btn">&times;</span>
        <h3 id="modal-message"></h3>
    </div>
  </div>

  <script>
      // 로그인 폼 제출 시 비동기 요청
      document.getElementById('login-form').addEventListener('submit', function(event) {
          event.preventDefault();  // 기본 폼 제출 막기

          var formData = new FormData(event.target);

          fetch("{% url 'accounts:login_view' %}", {
              method: 'POST',
              body: formData
          })
          .then(response => response.json())
          .then(data => {
              // 모달 창에 로그인 성공 메시지 또는 오류 메시지 표시
              document.getElementById('modal-message').textContent = data.message;
              document.getElementById('modal').style.display = 'block';  // 모달 표시

              if (data.access) {
                // jwt를 localstorage에 저장
                  localStorage.setItem('access_token', data.access);
                  localStorage.setItem('refresh_token', data.refresh);

                  setTimeout(function() {
                    window.location.href = "/"; // 홈으로
                   }, 2000);
              }
          })
          .catch(error => {
              document.getElementById('modal-message').textContent = '로그인 중 오류가 발생했습니다.';
              document.getElementById('modal').style.display = 'block';  // 모달 표시
          });
      });

      // 모달 닫기
      document.getElementById('close-btn').addEventListener('click', function() {
          document.getElementById('modal').style.display = 'none';
      });
  </script>

{% endblock %}
