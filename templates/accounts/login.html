{% extends 'nav_base.html' %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="login-container">
  <h1 class="login-title">Log In</h1>

  <form method="POST" action="{% url 'accounts:login_view' %}" id="login-form">
    {% csrf_token %}

    <div class="input-wrapper">
      <input type="text" id="username" name="username" class="login-input" required placeholder="아이디" />
      <input type="password" id="password" name="password" class="login-input" required placeholder="비밀번호" />
    </div>

    <div class="login-buttons">
      <button type="submit" class="login-btn">로그인</button>
      <a href="{% url 'accounts:register' %}" class="signup-btn">회원가입</a>
    </div>
  </form>

  <p class="login-bottom-link">
    회원가입이 아직 안되셨나요? <a href="{% url 'accounts:register' %}">회원가입</a>
  </p>
</div>

<!-- 모달창 -->
<div class="modal-overlay" id="modal" style="display: none;">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 id="modal-message">환영합니다</h2>
    <button class="modal-button" onclick="closeModal()">닫기</button>
  </div>
</div>

<script>
  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }

  document.getElementById('login-form').addEventListener('submit', function(event) {
    event.preventDefault();
    const formData = new FormData(event.target);

    fetch("{% url 'accounts:login_view' %}", {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      const modal = document.getElementById('modal');
      const modalMessage = document.getElementById('modal-message');

      modalMessage.textContent = data.message || '로그인 성공!';
      modal.style.display = 'flex';

      if (data.access) {
        localStorage.setItem('access_token', data.access);
        localStorage.setItem('refresh_token', data.refresh);
        setTimeout(function() {
          window.location.href = "/";
        }, 2000);
      }
    })
    .catch(error => {
      const modal = document.getElementById('modal');
      const modalMessage = document.getElementById('modal-message');

      modalMessage.textContent = '로그인 중 오류가 발생했습니다.';
      modal.style.display = 'flex';
    });
  });
</script>
{% endblock %}
