{% extends 'nav_base.html' %}
{% load static %}


{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="login-container">
  <img src="{% static 'img/logo.png' %}" alt="zer0 Litter 로고" class="login-logo">

  <form method="POST" action="{% url 'accounts:login_view' %}" id="login-form">
    {% csrf_token %}
    <div class="input-wrapper">
      <input type="text" name="username" class="login-input" required placeholder="아이디" />
      <input type="password" name="password" class="login-input" required placeholder="비밀번호" />
    </div>

    <div class="login-button-wrapper">
      <button type="submit" class="login-btn">로그인</button>
      <div class="signup-wrapper">
        <a href="{% url 'accounts:register' %}" class="signup-btn">회원가입</a>
      </div>
    </div>
  </form>
</div>

{% if messages %}
  {% for message in messages %}
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        showModal(`{{ message|escapejs }}`);
      });
    </script>
  {% endfor %}
{% endif %}



{% endblock %}

{% block extra_script %}
<script>
  // 로그인 비동기 처리
  const form = document.getElementById('login-form');
  form.addEventListener('submit', function(event) {
    event.preventDefault();
    const formData = new FormData(form);
    fetch("{% url 'accounts:login_view' %}", {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.access) {
        localStorage.setItem('access_token', data.access);
        localStorage.setItem('refresh_token', data.refresh);

        // 서버가 내려준 redirect로 이동 (스태프면 pending_list, 아니면 마이페이지)
        const target = data.redirect || "{% url 'trash_loc:home' %}";
        window.location.href = target;
      } else {
        showModal(data.message || data.detail || '로그인 실패');
      }
    })
    .catch(() => {
      showModal('로그인 중 오류가 발생했습니다.');
    });
  });

  // 로그인 필요 시 쿠키 기반 모달 표시
  const cookies = document.cookie.split(';').map(c => c.trim());
  const loginCookie = cookies.find(c => c.startsWith("show_login_required_modal="));
  if (loginCookie && loginCookie.endsWith("1")) {
    setTimeout(() => {
      if (typeof showModal === 'function') {
        showModal("로그인이 필요합니다!");
      } else {
        alert("로그인이 필요합니다! (모달 함수 없음)");
      }
    }, 200);
    document.cookie = "show_login_required_modal=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
  }

  document.addEventListener('DOMContentLoaded', () => {
    const cookies = document.cookie.split(';').map(c => c.trim());
    const deletedCookie = cookies.find(c => c.startsWith("show_account_deleted_modal="));
    if (deletedCookie && deletedCookie.endsWith("1")) {
      showModal("계정이 성공적으로 삭제되었습니다.");
      // 쿠키 제거 (재방지)
      document.cookie = "show_account_deleted_modal=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
    }
  });

</script>
{% endblock %}
