{% extends 'nav_base.html' %}
{% block title %}회원정보 수정{% endblock %}

{% block content %}
{% if user.is_authenticated %}
  <!-- 로그인한 경우: 기존 회원정보 수정 폼 그대로 보여줌 -->
  <div class="container" style="max-width: 600px; margin: auto;">
    <div style="display: flex; align-items: center; margin-top: 20px;">
      <a href="{% url 'accounts:mypage_home' %}" style="text-decoration: none; font-size: 24px; margin-right: 10px;">←</a>
      <h2 style="margin: 0;">회원 정보 수정</h2>
    </div>

    <form method="post" action="{% url 'accounts:mypage_update' %}" onsubmit="return validateForm()">
      {% csrf_token %}

      <div>
        <label>아이디</label><br>
        <input type="text" name="username" value="{{ user.username }}" readonly>
      </div><br>

      <div>
        <label>현재 비밀번호 확인 <span style="color:red;">*</span></label><br>
        <input type="password" id="current_pw" name="current_password" required onblur="checkCurrentPassword()">
        <button type="button" onclick="togglePassword('current_pw')">👁️</button>
        <div id="pw-check-result" style="font-size: 13px; margin-top: 5px;"></div>
      </div><br>

      <div>
        <label>새 비밀번호 변경 <small>(선택)</small></label><br>
        <input type="password" id="new_pw" name="password" autocomplete="new-password" placeholder="새 비밀번호 (선택)">
        <button type="button" onclick="togglePassword('new_pw')">👁️</button>
      </div><br>

      <div>
        <label>새 비밀번호 확인 <small>(선택)</small></label><br>
        <input type="password" id="confirm_pw" name="password_confirm" autocomplete="new-password" placeholder="새 비밀번호 재입력">
        <button type="button" onclick="togglePassword('confirm_pw')">👁️</button>
      </div><br>

      <div>
        <label>전화번호</label><br>
        <input type="text" id="phone" name="phone_number" value="{{ user.phone_number }}">
      </div><br>

      <div>
        <label>주소</label><br>
        <input type="text" name="address" value="{{ user.address }}">
      </div><br>

      <div style="margin-top: 20px;">
        <button type="submit">수정 완료</button>
        <button type="button" onclick="location.href='{% url 'accounts:mypage_home' %}'">취소</button>
      </div>
    </form>
  </div>
{% else %}
  <!-- 로그인하지 않은 경우: 로그인 유도 메시지 -->
  <div class="container" style="max-width: 600px; margin: auto; margin-top: 50px; text-align: center;">
    <h2>로그인이 필요합니다</h2>
    <p>회원정보를 수정하려면 로그인이 필요합니다.</p>
    <a href="{% url 'accounts:login' %}?next={% url 'accounts:mypage_edit' %}" class="btn btn-primary">로그인하러 가기</a>
  </div>
{% endif %}

<script src="https://cdn.jsdelivr.net/npm/cleave.js@1.6.0/dist/cleave.min.js"></script>

<script>
  new Cleave('#phone', {
    delimiters: ['-', '-'],
    blocks: [3, 4, 4],
    numericOnly: true
  });

  function validateForm() {
    const pw = document.querySelector('input[name="password"]').value;
    const regex = /^(?=.*[a-z])(?=.*\d)(?=.*[@$!%*#?&]).{8,}$/;

    if (pw && !regex.test(pw)) {
      alert("비밀번호는 최소 8자, 소문자, 숫자, 특수문자를 포함해야 합니다.");
      return false;
    }
    return true;
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");

      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();

        // 이 쿠키가 우리가 찾는 name이면 꺼냄
        if (cookie.substring(0, name.length + 1) === name + "=") {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function togglePassword(id) {
    const field = document.getElementById(id);
    field.type = field.type === 'password' ? 'text' : 'password';
  }

  function checkCurrentPassword() {
  const password = document.getElementById("current_pw").value;
  if (!password) return;

  fetch("/accounts/check-password/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": getCookie("csrftoken"),
    },
    body: JSON.stringify({ password }),
  })
    .then((res) => res.json())
    .then((data) => {
      const msg = document.getElementById("pw-check-result");
      if (data.valid) {
        msg.innerText = "✔ 비밀번호가 확인되었습니다.";
        msg.style.color = "green";
      } else {
        msg.innerText = "✖ 비밀번호가 일치하지 않습니다.";
        msg.style.color = "red";
      }
    });
}

  function validateForm() {
    const pw = document.querySelector('input[name="password"]').value;
    const pwConfirm = document.querySelector('input[name="password_confirm"]').value;
    const regex = /^(?=.*[a-z])(?=.*\d)(?=.*[@$!%*#?&]).{8,}$/;
    const currentPw = document.getElementById("current_pw").value;

    if (pw) {
      if (!regex.test(pw)) {
        alert("비밀번호는 최소 8자, 소문자, 숫자, 특수문자를 포함해야 합니다.");
        return false;
      }
      if (pw !== pwConfirm) {
        alert("새 비밀번호와 확인이 일치하지 않습니다.");
        return false;
      }
      if (pw === currentPw) {
        alert("새 비밀번호는 현재 비밀번호와 달라야 합니다.");
        return false;
      }
    }


  return true;
}

</script>
{% endblock %}
