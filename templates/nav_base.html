<!-- templates/nav_base.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}zer0 Litter{% endblock %}</title>

  {% load static %}
  <!-- CSS 분리된 외부 파일 로드 -->
  <link rel="stylesheet" href="{% static 'css/common.css' %}">
  <link rel="stylesheet" href="{% static 'css/nav.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app-wrapper">
    <!-- ✅ 상단 헤더 -->
    <header class="header">
      <div class="logo">
        <a href="{% url 'trash_loc:home' %}">
          <img src="{% static 'img/logo.png' %}" alt="zer0 Litter" />
        </a>
      </div>
      <div style="display: flex; align-items: center;">
        <button class="hamburger" onclick="toggleMenu()">☰</button>
      </div>
    </header>

    <!-- ✅ 햄버거 드롭다운 메뉴 -->
    <nav id="sideMenu" class="side-menu hidden">
      <ul>
        <li id="login-menu"><a href="{% url 'accounts:login' %}" class="active">로그인/회원가입</a></li>
        <li><a href="{% url 'trash_loc:home' %}">쓰레기통 위치</a></li>
        <li><a href="{% url 'complain:complain_add' %}">민원</a></li>
        <li><a href="{% url 'accounts:mypage_home' %}">마이페이지</a></li>
        <li><a href="{% url 'dashboard:dashboard' %}">통계보기</a></li>
        <!-- 로그아웃 메뉴 항목 추가 -->
        <li id="logout-menu" style="display:none;">
          <a href="#" id="logout-link">로그아웃</a>
        </li>
      </ul>
    </nav>

    <!-- ✅ 본문 영역 -->
    <main>
      {% block content %}{% endblock %}
    </main>

    <!-- ✅ 하단 네비게이션 -->
    <footer class="bottom-nav">
      <a href="{% url 'trash_loc:home' %}">지도</a>
      <a href="{% url 'complain:complain_add' %}">민원</a>
      <a href="{% url 'accounts:mypage_home' %}">my</a>
      {% if scenario_id %}
        <a href="{% url 'chatbot:chatbot_chat' scenario_id=scenario_id %}">챗봇</a>
      {% else %}
        <a href="{% url 'chatbot:chatbot_chat_default' %}">챗봇</a>
      {% endif %}
    </footer>
  </div>

  <!-- 공통 모달 -->
  <div id="common-modal" class="modal-overlay">
    <div class="modal-content">
      <span id="close-btn" onclick="hideModal()">×</span>
      <p id="modal-message"></p>
      <button id="modal-confirm-btn" onclick="hideModal()">확인</button>
    </div>
  </div>

  <script>
    function showModal(message, redirectUrl = null, delay = 2000) {
      const modal = document.getElementById('common-modal');
      const messageBox = document.getElementById('modal-message');
      const confirmBtn = document.getElementById('modal-confirm-btn');
      messageBox.innerHTML = message;
      messageBox.dataset.active = "true";
      modal.style.display = 'flex';

      confirmBtn.onclick = () => {
        hideModal();
        if (redirectUrl) {
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, delay);
        }
      };
    }

    function hideModal() {
      document.getElementById('common-modal').style.display = 'none';
      const messageBox = document.getElementById('modal-message');
      messageBox.dataset.active = "false";
    }

    function toggleMenu() {
      const menu = document.getElementById("sideMenu");
      menu.classList.toggle("hidden");
    }

    // 로그인 상태 체크 : access_token 있으면 로그아웃 버튼 표시
    window.addEventListener('DOMContentLoaded', function () {
      const accessToken = localStorage.getItem('access_token');
      const loginMenu = document.getElementById('login-menu');
      const logoutMenu = document.getElementById('logout-menu');

      if (accessToken) {
        if (loginMenu) loginMenu.style.display = 'none';
        if (logoutMenu) logoutMenu.style.display = 'block';
      } else {
        if (loginMenu) loginMenu.style.display = 'block';
        if (logoutMenu) logoutMenu.style.display = 'none';
      }

      // 공통 모달 강제 노출 방지
      const modal = document.getElementById("common-modal");
      const message = document.getElementById("modal-message");
      if (message.dataset.active === "true" && message.innerHTML.trim() !== "") {
        modal.style.display = "flex";
      } else {
        modal.style.display = "none";
      }
    });

    // 로그아웃 버튼 클릭 시
    document.getElementById('logout-link')?.addEventListener('click', function (e) {
      e.preventDefault();
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
      alert("로그아웃 되었습니다.");
      window.location.href = "{% url 'trash_loc:home' %}";
    });
  </script>
</body>
</html>
