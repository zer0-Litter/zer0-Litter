<!-- templates/nav_base.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}zer0 Litter{% endblock %}</title>

  {% load static %}
  <!-- CSS 분리된 외부 파일 로드 -->
  <link rel="stylesheet" href="{% static 'css/common.css' %}">
  <link rel="stylesheet" href="{% static 'css/nav.css' %}">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app-wrapper">
    <!-- ✅ 상단 헤더 -->
    <header class="header">
      <div class="logo">
        <a href="{% url 'trash_loc:home' %}">
          <img src="{% static 'img/logo.png' %}" alt="zer0 Litter" />
        </a>
      </div>
      <div style="display: flex; align-items: center;">

          <button class="hamburger" onclick="toggleMenu()">☰</button>
      </div>
    </header>

    <!-- ✅ 햄버거 드롭다운 메뉴 -->
    <nav id="sideMenu" class="side-menu hidden">
      <ul>
        <li id="login-menu"><a href="{% url 'accounts:login' %}" class="active">로그인/회원가입</a></li>
        <li><a href="{% url 'trash_loc:home' %}">쓰레기통 위치</a></li>
        <li><a href="{% url 'complain:complain_add' %}">민원</a></li>
        <li><a href="{% url 'accounts:mypage_home' %}">마이페이지</a></li>
        <li><a href="{% url 'dashboard:dashboard' %}">통계보기</a></li>
        <!-- 로그아웃 메뉴 항목 추가 -->
        <li id="logout-menu" style="display:none;">
          <a href="#" id="logout-link">로그아웃</a>
        </li>
      </ul>
    </nav>

    <!-- ✅ 본문 영역 -->
    <main>
      {% block content %}
      {% endblock %}
    </main>

    <!-- ✅ 하단 네비게이션 -->
    <footer class="bottom-nav">
      <a href="{% url 'trash_loc:home' %}">지도</a>
      <a href="{% url 'complain:complain_add' %}">민원</a>
      <a href="{% url 'accounts:mypage_home' %}">my</a>
      {% if scenario_id %}
        <a href="{% url 'chatbot:chatbot_chat' scenario_id=scenario_id %}">챗봇</a>
      {% else %}
        <a href="{% url 'chatbot:chatbot_chat_default' %}">챗봇</a>
      {% endif %}
    </footer>
  </div>

  <!-- ✅ 메뉴 토글 스크립트 -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById("sideMenu");
      menu.classList.toggle("hidden");
    }

    // 로그인 상태 체크: access_token 있으면 로그아웃 버튼 표시
    window.addEventListener('DOMContentLoaded', function () {
      const accessToken = localStorage.getItem('access_token');
      const loginMenu = document.getElementById('login-menu'); // 햄버거 메뉴 속 로그인 회원가입
      const logoutMenu = document.getElementById('logout-menu'); // 햄버거 안 로그아웃 메뉴

      if (accessToken) {
        if(loginMenu) loginMenu.style.display = 'none'; // 로그인 시 햄버거 바 안 로그인, 회원가입 숨김
        if(logoutMenu) logoutMenu.style.display = 'block';
      } else {
        if(loginMenu) loginMenu.style.display = 'block'; // 비로그인 상태면 표시
        if(logoutMenu) logoutMenu.style.display = 'none';
      }
    });

    // 로그아웃 버튼 클릭 시
    document.getElementById('logout-link')?.addEventListener('click', function (e) {
      e.preventDefault();
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
      alert("로그아웃 되었습니다.");
      window.location.href = "{% url 'trash_loc:home' %}";
    });
  </script>

  <!-- Bootstrap JS Bundle (modal 포함) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
