name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.in

      # konlpy(Okt) 형태소 분석기는 런타임에 JVM 이 필요하다
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.in 은 직접 의존성만 담고 mysqlclient(리눅스 빌드 까다로움)를 제외한다
          pip install -r requirements.in

      - name: Run tests
        # CI 에는 .env 가 없으므로 settings 가 요구하는 환경변수를 테스트용 더미값으로 주입한다.
        # (pytest-django 가 conftest 보다 먼저 settings 를 로드해 conftest 기본값만으론 부족함)
        # MongoDB 는 mongomock(in-memory), DB 는 SQLite 테스트 DB 를 사용한다.
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          MONGO_URI: "mongodb://localhost:27017/complaints_db"
          OPENAI_API_KEY: test-openai-key
          KAKAO_MAP_API_KEY: test-kakao-key
        run: pytest
